# Controlled vocabularies (SCHEMA.md §3). Lint rejects values outside these.
vocab:
  type: [vendor, category, comparison, overview]
  adoption_tier:
    - day-1               # table stakes before any AI in production
    - day-2               # required once scaling / agents
    - situational         # depends on deployment pattern; page must state trigger
    - firm-type-specific  # page must state firm type
    - practice            # a process, not a purchase (extension to draft §3.1)
  ownership_state:
    - public
    - pe-owned
    - independent
    - acquired-closed     # requires acquirer + announced + close dates
    - acquired-pending    # requires acquirer + announced date + verify_after
    - oss-foundation
    - oss-vendor-backed
    - maintenance-mode
    - defunct
  market_position:
    - leader
    - challenger
    - legacy-incumbent
    - ai-native-disruptor
    - platform-module
    - oss-default
    - niche-specialist
  deployment_model: [saas, self-hosted, hybrid, in-tenant, on-prem]
  # form_factor is an extension to draft §3.4: preserves how the product is
  # consumed (the old `deployment` field mixed this into deployment_model).
  form_factor: [inline-proxy, api, sdk, agent, browser-extension, platform]
  category_maturity: [nascent, growth, consolidating, mature]
  mcp_support: [none, client, server, gateway, unverified]
  data_leaves_tenancy: ["true", "false", partial, unverified]
  fs_traction: [verified, claimed, unverified]

# agent_security_context: true = the lethal trifecta (untrusted input +
# sensitive data + egress) is a core concern discussed on this category page
# and its primary vendors. On all other pages trifecta framing is flagged by
# editorial lint rule 18 (SCHEMA.md §5.2).

